[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portrait-collector"
version = "0.1.0"
description = "Synthetic Portrait Lab — a terminal darkroom for generating balanced synthetic portrait datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "reportlab>=4.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60", "rich>=13.0"]
gui = ["nicegui>=1.4", "pywebview>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = ["textual>=0.60", "rich>=13.0", "nicegui>=1.4", "pywebview>=5.0", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
portrait-cli = "app.cli.generate:main"
portrait-tui = "app.tui.main:main"
portrait-gui = "app.gui.main:main"
portrait-mask-print = "app.cli.mask_print:main"

[tool.setuptools]
packages = ["app", "app.core", "app.core.providers", "app.tui", "app.gui", "app.cli"]

[tool.setuptools.package-data]
"app.core" = ["model_registry.json", "assets/*.onnx", "assets/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
